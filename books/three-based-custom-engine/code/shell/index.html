<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Свой 3D-движок на three.js — состояния по главам</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; background: #0b0d10; color: #d8dee9; font: 14px/1.4 system-ui, sans-serif; }
      header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid #1e2430; }
      header b { margin-right: 8px; font-weight: 600; color: #8fb8ff; }
      button { font: inherit; padding: 6px 12px; border: 1px solid #2a3342; border-radius: 6px; background: #141922; color: #d8dee9; cursor: pointer; }
      button:hover { border-color: #3d4a5f; }
      button[aria-current='true'] { background: #1d63d1; border-color: #1d63d1; color: #fff; }
      p#demo { margin: 0; padding: 8px 14px; color: #8b96a8; border-bottom: 1px solid #1e2430; }
      main { padding: 14px; }
      canvas { display: block; background: #000; }
    </style>
  </head>
  <body>
    <header>
      <b>Состояние движка:</b>
      <span id="buttons"></span>
    </header>
    <p id="demo"></p>
    <main><canvas id="view"></canvas></main>
    <script type="module">
      const CHAPTERS = /*CHAPTERS*/;
      const wanted = new URLSearchParams(location.search).get('chapter');
      const chapter = CHAPTERS.find((c) => c.id === wanted) ?? CHAPTERS[CHAPTERS.length - 1];

      const buttons = document.getElementById('buttons');
      for (const item of CHAPTERS) {
        const button = document.createElement('button');
        button.textContent = `${item.number} · ${item.title}`;
        button.setAttribute('aria-current', String(item.id === chapter.id));
        button.addEventListener('click', () => {
          location.search = `?chapter=${item.id}`;
        });
        buttons.append(button);
      }
      document.getElementById('demo').textContent = chapter.demo;

      const script = document.createElement('script');
      script.type = 'module';
      script.src = `./${chapter.id}.js`;
      document.body.append(script);
    </script>
  </body>
</html>
